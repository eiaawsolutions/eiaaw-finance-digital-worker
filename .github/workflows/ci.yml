name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'

jobs:
  # ---------------------------------------------------------------------------
  # Static gates. Cheap, so they run first and fail fast.
  # ---------------------------------------------------------------------------
  static:
    name: Format · Lint · Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # eslint carries the D1-D8 architectural direction rules (DWD-06 s.1.3).
      - run: pnpm lint
      - run: pnpm typecheck

  # ---------------------------------------------------------------------------
  # Secret scan across the whole tree, not just the diff.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan tracked files
        run: pnpm tsx scripts/scan-secrets.ts --all

  # ---------------------------------------------------------------------------
  # Unit + integration. Integration needs Postgres with pgvector.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eiaaw_fdw_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eiaaw_fdw_test
      REDIS_URL: redis://localhost:6379
      DEPLOY_ENVIRONMENT: test
      RESIDENCY_ZONE: my-central
      INFISICAL_RESOLVER_ENABLED: 'false'
      OBSERVABILITY_CONFORMANCE_STRICT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # ---------------------------------------------------------------------------
  # The L8 release gate. DWD-06 s.0 and s.14: this is blocking, never advisory.
  # Phase 0 acceptance P0-4 requires that a deliberately broken change is
  # stopped here.
  # ---------------------------------------------------------------------------
  assurance-gate:
    name: L8 release gate
    runs-on: ubuntu-latest
    needs: [static]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eiaaw_fdw_gate
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eiaaw_fdw_gate
      DEPLOY_ENVIRONMENT: test
      RESIDENCY_ZONE: my-central
      INFISICAL_RESOLVER_ENABLED: 'false'
      ASSURANCE_RELEASE_GATE_BLOCKING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Run golden and adversarial suites, evaluate the release gate
        run: pnpm assurance:gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assurance-report
          path: assurance-runs/

  # ---------------------------------------------------------------------------
  # Observability conformance: a span missing a required attribute is a defect,
  # not a gap (DWD-06 s.12.3).
  # ---------------------------------------------------------------------------
  observability:
    name: Observability conformance
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm conformance:observability

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [static, test, assurance-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
